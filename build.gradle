plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'Portfolio Base backend API service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation (
			'org.springframework.boot:spring-boot-starter-web',
			'org.springframework.boot:spring-boot-starter-data-jpa',
			'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5',
			'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.11',
			'org.apache.commons:commons-lang3:3.18.0'
	)

	compileOnly 'org.projectlombok:lombok'

	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	annotationProcessor 'org.projectlombok:lombok'

	testImplementation (
			'org.springframework.boot:spring-boot-starter-test',
			'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	)

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
